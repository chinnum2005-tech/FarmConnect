services:
  - type: web
    name: agrotrace-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: BLOCKCHAIN_NETWORK
        value: amoy
      - key: POLYGON_RPC_URL
        sync: false
      - key: RPC_URL
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: AMOY_RELAYER_ADDRESS
        sync: false
      - key: AGROTRACE_REGISTRY_ADDRESS
        sync: false
      - key: TRACEABILITY_CONTRACT_ADDRESS
        sync: false
      - key: PROVENANCE_CONTRACT_ADDRESS
        sync: false
      - key: AI_SERVICE_URL
        value: https://agrotrace-ai-service.onrender.com
      - key: ML_SERVICE_URL
        value: https://agrotrace-ml-inference.onrender.com
      - key: CORS_ORIGIN
        value: https://agrotrace-web.onrender.com
      - key: FRONTEND_URL
        value: https://agrotrace-web.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        sync: false
      - key: AGMARKNET_BASE_URL
        value: https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: agrotrace-ai-service
    env: python
    region: oregon
    plan: free
    rootDir: services/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: NDVI_SIMULATION_MODE
        value: "true"
      - key: EARTH_ENGINE_PROJECT_ID
        sync: false
    autoDeploy: true

  - type: web
    name: agrotrace-ml-inference
    env: python
    region: oregon
    plan: free
    rootDir: apps/ml-inference
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: PORT
        value: 10000
    autoDeploy: true

  - type: web
    name: agrotrace-web
    env: static
    rootDir: apps/web
    buildCommand: npm install && npm install @esbuild/linux-x64 @rollup/rollup-linux-x64-gnu && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://agrotrace-backend.onrender.com
      - key: VITE_API_URL
        value: https://agrotrace-backend.onrender.com
      - key: VITE_AI_SERVICE_URL
        value: https://agrotrace-ai-service.onrender.com
